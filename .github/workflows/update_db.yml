name: Aktualizacja bazy notowań GPW

on:
  schedule:
    # Codziennie o 17:30 UTC = 18:30 czasu polskiego (lato) / 18:30 CET (zima +1h)
    # GPW kończy sesję o 17:05 CET, dane na Yahoo pojawiają się zwykle do 18:00
    - cron: "30 17 * * 1-5"   # tylko dni robocze (pon–pt)
  workflow_dispatch:            # możliwość ręcznego uruchomienia z GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # potrzebne do commitu

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install yfinance pandas

      - name: Uruchom aktualizację bazy
        run: python update_db.py

      - name: Zatwierdź i wypchnij zmiany
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add dane_gpw.db
          # Commituj tylko jeśli plik się zmienił
          git diff --staged --quiet || git commit -m "auto: aktualizacja notowań $(date +'%Y-%m-%d')"
          git push origin main
